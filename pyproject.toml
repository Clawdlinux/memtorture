[project]
name = "memtorture"
version = "0.1.0"
description = "Torture tests for agent memory engines. Evidence, not marketing."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = []

[project.scripts]
memtorture = "memtorture.cli:main"

[dependency-groups]
dev = [
    "hypothesis==6.151.9",
    "pytest==9.0.2",
    "ruff==0.15.0",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: opt-in native suite scenarios (use --slow)"]

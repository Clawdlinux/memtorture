[project]
name = "memproof"
version = "0.1.0"
description = "Agent memory benchmarks. Evidence, not proof."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "mcp==1.26.0",
    "qdrant-client==1.16.2",
]

[project.scripts]
memproof = "memproof.cli:main"

[dependency-groups]
dev = [
    "hypothesis==6.151.9",
    "pytest==9.0.2",
    "ruff==0.15.0",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
